<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="" width="52" height="40">
      <span class="brand-name">Alli Rose <em>Design</em></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
    <nav class="site-nav">
      {% assign links = "Portfolio:/portfolio/,About:/about/,Resume:/resume/,Journal:/journal/,Contact:/contact/" | split: "," %}
      {% for l in links %}{% assign p = l | split: ":" %}
      <a href="{{ p[1] | relative_url }}"{% if page.url contains p[1] %} class="active"{% endif %}>{{ p[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
